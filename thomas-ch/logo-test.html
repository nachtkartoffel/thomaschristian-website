<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo-Test – thomas·ch</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg:#fff; --ink:#000; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Instrument Sans",system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; display:grid; place-items:center; padding:48px 16px; }
  main { display:grid; gap:56px; justify-items:center; width:100%; max-width:960px; }

  /* Logo: kreisrunde Maske + schwarzer Stroke */
  .logo { display:block; width:var(--size,320px); aspect-ratio:1065.5 / 1108.4; }
  .logo svg { display:block; width:100%; height:100%; }

  /* Blinzel-Teile: skalieren/verschieben in ihrer eigenen Bounding-Box */
  .logo .pupil, .logo .lid--r, .logo .brow, .logo .lowlid, .logo .mouth, .logo .dimple, .logo .fx { transform-box:fill-box; transform-origin:50% 50%; }
  .logo .pupil { transform-origin:50% 96%; }
  .logo .idle { transform-box:view-box; transform-origin:532px 1090px; }   /* Grundbewegung: Drehpunkt unten mittig */
  .logo .brow { stroke:#fff; stroke-width:0; paint-order:stroke fill; stroke-linejoin:round; } /* weißer Abstand zu den Haaren, nur bei Erstaunt & Nachdenklich */
  .logo .fx { transform:scale(0); }                     /* neue Formen: wachsen aus 0 heraus */
  .logo .tear, .logo .sweat, .logo .bridge { transform-origin:50% 0; }   /* wachsen von oben (aus Auge / Schläfe) */
  .logo .dimple { transform-origin:30% 100%; }            /* zieht sich in den Mundwinkel zurück */
  .logo .tear, .logo .sweat { fill:#fff; stroke:#000; stroke-width:6; }

  .hero { --size:min(72vw,420px); }
  .row { display:flex; flex-wrap:wrap; gap:40px; align-items:end; justify-content:center; }
  .row figure { display:grid; gap:12px; justify-items:center; }
  figcaption { font-size:13px; letter-spacing:.02em; opacity:.6; font-variant-numeric:tabular-nums; }
  .lockup { display:flex; align-items:center; gap:16px; }
  .lockup b { font-family:"Instrument Serif",serif; font-weight:400; font-size:32px; line-height:1; }
  .lockup div span { display:block; font-size:13px; opacity:.6; margin-top:4px; }
  .dark { background:#000; color:#fff; padding:32px 40px; display:flex; gap:24px; align-items:center; border-radius:2px; }
  .dark .logo { --size:96px; }
  .stage { display:grid; gap:24px; justify-items:center; }
  .moods { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
  button { font:inherit; font-size:14px; padding:10px 18px; border:1px solid var(--ink); background:var(--bg); color:var(--ink); cursor:pointer; }
  button:hover { background:var(--ink); color:var(--bg); }
</style>
</head>
<body>
<main>
  <div class="stage">
    <a class="logo hero" data-blink aria-label="thomas·ch Logo"></a>
    <div class="moods" role="group" aria-label="Gesichtsausdrücke">
      <button type="button" id="blinkAll">Blinzeln</button>
      <button type="button" data-mood="erstaunt">Erstaunt</button>
      <button type="button" data-mood="wuetend">Wütend</button>
      <button type="button" data-mood="nachdenklich">Nachdenklich</button>
      <button type="button" data-mood="aengstlich">Ängstlich</button>
      <button type="button" data-mood="weinend">Weinend</button>
    </div>
  </div>

  <div class="row">
    <figure><span class="logo" style="--size:160px" data-blink></span><figcaption>160 px</figcaption></figure>
    <figure><span class="logo" style="--size:96px" data-blink></span><figcaption>96 px</figcaption></figure>
    <figure><span class="logo" style="--size:64px" data-blink></span><figcaption>64 px</figcaption></figure>
    <figure><span class="logo" style="--size:40px" data-blink></span><figcaption>40 px</figcaption></figure>
  </div>

  <div class="lockup">
    <span class="logo" style="--size:72px" data-blink></span>
    <div><b>thomas·ch</b><span>Thomas Christian · Art Director</span></div>
  </div>

</main>

<script>
(() => {
  const tpl = document.getElementById('logoTpl');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a, b) => a + Math.random() * (b - a);

  // Wie weit das Oberlid nach unten fährt (SVG-Einheiten)
  const LID_DROP = 66;   // nur rechtes Oberlid; die linke Augenbraue bleibt stehen

  function blink(svg, speed = 1) {
    if (svg.dataset.mood) return 0;                   // während eines Ausdrucks nicht blinzeln
    const d = rand(150, 230) / speed;                 // Dauer variiert leicht
    const opts = { duration: d, easing: 'cubic-bezier(.4,0,.3,1)' };
    const offs = [0, .42, .58, 1];                    // schnell zu, kurz halten, auf
    svg.querySelectorAll('.pupil').forEach(p =>
      p.animate([{ transform:'scaleY(1)' }, { transform:'scaleY(.04)' }, { transform:'scaleY(.04)' }, { transform:'scaleY(1)' }]
        .map((k, i) => ({ ...k, offset: offs[i] })), opts));
    svg.querySelectorAll('.lid--r').forEach(l => {
      const y = LID_DROP;
      l.animate([{ transform:'translateY(0)' }, { transform:`translateY(${y}px)` }, { transform:`translateY(${y}px)` }, { transform:'translateY(0)' }]
        .map((k, i) => ({ ...k, offset: offs[i] })), opts);
    });
    return d;
  }

  /* Grundbewegung – läuft dauerhaft auf der Gruppe, die die ganze Figur enthält.
     Alle Ausdrücke animieren nur einzelne Teile darin, deshalb überlagern sich beide sauber.
     Zwei Schichten mit krummen Laufzeiten (additiv), damit es nie mechanisch wirkt. */
  function idle(svg) {
    const fig = svg.querySelector('.st1 > g'); if (!fig) return;
    fig.classList.add('idle');
    const phase = () => -rand(0, 20000);              // jede Instanz startet woanders im Zyklus
    fig.animate([                                     // leichtes Neigen & Wiegen
      { transform: 'translate(0px,0px) rotate(0deg)' },
      { transform: 'translate(-3px,0px) rotate(-1.1deg)', offset: .3 },
      { transform: 'translate(2px,-1px) rotate(.7deg)', offset: .62 },
      { transform: 'translate(-1px,0px) rotate(-.3deg)', offset: .85 },
      { transform: 'translate(0px,0px) rotate(0deg)' },
    ], { duration: 15000, iterations: Infinity, easing: 'ease-in-out', delay: phase(), composite: 'add' });
    fig.animate([                                     // Atmen
      { transform: 'translateY(0px)' }, { transform: 'translateY(-5px)' }, { transform: 'translateY(0px)' },
    ], { duration: 7000, iterations: Infinity, easing: 'ease-in-out', delay: phase(), composite: 'add' });
  }

  // Unregelmäßig: meist 2–6 s Pause, manchmal Doppel-Blinzeln, selten lange Pause
  function schedule(svg) {
    const r = Math.random();
    const wait = r < .12 ? rand(6000, 9000) : rand(1800, 5500);
    setTimeout(() => {
      const d = blink(svg);
      if (Math.random() < .22) setTimeout(() => blink(svg, 1.15), d + rand(90, 160));
      schedule(svg);
    }, wait);
  }

  document.querySelectorAll('[data-blink]').forEach(host => {
    const node = tpl.content.cloneNode(true);
    host.appendChild(node);
    const svg = host.querySelector('svg');
    // Brauen nach oben in der Zeichenreihenfolge, damit ihr weißer Rand die Haare überdecken kann
    svg.querySelectorAll('.brow').forEach(b => b.parentNode.appendChild(b));
    // linke Gesichtskontur wieder darüber, damit der weiße Rand der linken Braue sie nicht anschneidet
    svg.querySelectorAll('.contour').forEach(c => { const g = svg.querySelector('.st1 > g'); g.appendChild(c); });
    if (!reduce) idle(svg);
    if (!reduce) setTimeout(() => schedule(svg), rand(200, 2500));
    host.addEventListener('mouseenter', () => blink(svg));
  });

  document.getElementById('blinkAll').addEventListener('click', () =>
    document.querySelectorAll('[data-blink] svg').forEach(s => blink(s)));

  /* ---------- Gesichtsausdrücke ----------
     Alles läuft über Formveränderung – keine Transparenz:
     · Brauen, Lider, Pupillen: verschieben / drehen / stauchen
     · Mund: echtes Morphing der Kontur (Punkte werden interpoliert)
     · Neue Formen (Tränen, Schweiß, Denkblasen) wachsen aus Größe 0 heraus und schrumpfen wieder weg
     T(x, y, rot, sx, sy) – Werte in SVG-Einheiten bzw. Grad. */
  const T = (x = 0, y = 0, a = 0, sx = 1, sy = sx) => `translate(${x}px,${y}px) rotate(${a}deg) scale(${sx},${sy})`;
  const N = T();
  const ZERO = T(0, 0, 0, 0);
  const HOLD = 2600, IN = .14, OUT = .86;           // Anteil der Gesamtdauer für Rein/Raus
  const EASE = 'cubic-bezier(.3,0,.2,1)';

  /* --- Morph-Werkzeug für den Mund --- */
  const NPTS = 120;
  const area = p => p.reduce((s, [x, y], i) => { const [x2, y2] = p[(i + 1) % p.length]; return s + x * y2 - x2 * y; }, 0) / 2;
  function resample(poly, n = NPTS) {               // geschlossenes Polygon gleichmäßig nach Bogenlänge abtasten
    const seg = poly.map((p, i) => { const q = poly[(i + 1) % poly.length]; return Math.hypot(q[0] - p[0], q[1] - p[1]); });
    const L = seg.reduce((a, b) => a + b, 0); const out = []; let i = 0, acc = 0;
    for (let k = 0; k < n; k++) {
      const d = L * k / n;
      while (acc + seg[i] < d) { acc += seg[i]; i++; }
      const t = seg[i] ? (d - acc) / seg[i] : 0, p = poly[i], q = poly[(i + 1) % poly.length];
      out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]);
    }
    return out;
  }
  function samplePath(el) {
    const L = el.getTotalLength();
    return Array.from({ length: NPTS }, (_, i) => { const p = el.getPointAtLength(L * i / NPTS); return [p.x, p.y]; });
  }
  function align(src, dst) {                          // gleiche Laufrichtung + bester Startpunkt → kein Verdrehen
    if (Math.sign(area(src)) !== Math.sign(area(dst))) dst = dst.slice().reverse();
    let best = 0, bestD = Infinity;
    for (let o = 0; o < dst.length; o++) {
      let d = 0; for (let i = 0; i < src.length; i++) { const a = src[i], b = dst[(i + o) % dst.length]; d += (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2; }
      if (d < bestD) { bestD = d; best = o; }
    }
    return src.map((_, i) => dst[(i + best) % dst.length]);
  }
  const toD = p => 'M' + p.map(([x, y]) => x.toFixed(1) + ',' + y.toFixed(1)).join('L') + 'Z';
  const bbox = p => { const xs = p.map(q => q[0]), ys = p.map(q => q[1]);
    return { cx: (Math.min(...xs) + Math.max(...xs)) / 2, cy: (Math.min(...ys) + Math.max(...ys)) / 2 }; };
  // Punkte transformieren: spiegeln/skalieren/drehen um die Mund-Mitte, dann verschieben
  const xform = (p, { sx = 1, sy = 1, a = 0, dx = 0, dy = 0 } = {}) => {
    const { cx, cy } = bbox(p), r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    return p.map(([x, y]) => { const u = (x - cx) * sx, v = (y - cy) * sy; return [cx + u * c - v * s + dx, cy + u * s + v * c + dy]; });
  };
  const ellipse = (cx, cy, rx, ry) => Array.from({ length: NPTS }, (_, i) => { const t = i / NPTS * Math.PI * 2; return [cx + rx * Math.cos(t), cy + ry * Math.sin(t)]; });
  // Strich als Fläche: Mittellinie f(t) mit Breite w(t)
  function strokeShape(f, w, n = 60) {
    const top = [], bot = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, [x, y] = f(t), [x2, y2] = f(Math.min(1, t + .01)), [x0, y0] = f(Math.max(0, t - .01));
      let nx = -(y2 - y0), ny = x2 - x0; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
      const h = w(t) / 2; top.push([x + nx * h, y + ny * h]); bot.push([x - nx * h, y - ny * h]);
    }
    return resample(top.concat(bot.reverse()));
  }
  const taper = (m) => t => m * Math.sin(Math.PI * t) ** .6 + 1.2;

  // Zielformen für den Mund (bekommen die Originalpunkte, liefern neue Punkte)
  const MOUTH = {
    erstaunt:     () => ellipse(432, 588, 15, 21),                                        // Lächeln zieht sich zum „O“ zusammen
    wuetend:      p => xform(p, { sx: .8, sy: -1.1, dx: 4, dy: 8 }),                       // umgedreht, enger
    nachdenklich: () => strokeShape(t => [428 + 44 * t, 586 - 9 * t + 3 * Math.sin(Math.PI * t)], t => 5.5 * Math.sin(Math.PI * t) ** .4 + 1.5), // „Hmm“: kurz, flach, in den Mundwinkel geschoben
    aengstlich:   () => strokeShape(t => [404 + 62 * t, 590 + 4.5 * Math.sin(t * Math.PI * 3)], taper(5)), // Wellenlinie
    weinend:      () => strokeShape(t => [400 + 66 * t, 600 - 15 * Math.sin(Math.PI * t) + 2 * t], t => 8 * Math.sin(Math.PI * t) ** .5 + 1.5), // zitternder Bogen nach unten
  };

  // Geschlossene, zusammengekniffene Augen (Weinen): Pupille morpht zu einem Bogen
  const closedArc = (x0, x1, base, hgt, w) => () => strokeShape(t => [x0 + (x1 - x0) * t, base - hgt * Math.sin(Math.PI * t)], t => w * Math.sin(Math.PI * t) ** .5 + 2);
  // Form auf ihre Mittellinie zusammenziehen → Strich wird dünner, bis er weg ist
  const thinOut = p => mid(mid(mid(p)));            // mehrfach, damit wirklich nichts übrig bleibt
  const mid = p => p.map((a, i) => {
    let best = null, bd = Infinity;
    p.forEach((b, j) => { const k = Math.abs(i - j), gap = Math.min(k, p.length - k);
      if (gap > p.length / 8) { const d = (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2; if (d < bd) { bd = d; best = b; } } });
    return [(a[0] + best[0]) / 2, (a[1] + best[1]) / 2];
  });
  thinOut.vanish = true;
  const EYES = {
    erstaunt: { '.chin': thinOut },
    weinend: { '.eye--r': closedArc(450, 512, 462, 16, 9), '.eye--l': closedArc(340, 384, 464, 12, 8), '.lid--r': thinOut, '.chin': thinOut },
  };

  function morph(el, target, dur) {
    const orig = el.dataset.d || (el.dataset.d = el.getAttribute('d'));
    el.setAttribute('d', orig);
    const src = samplePath(el);
    const dst = align(src, resample(target(src)));
    const t0 = performance.now(), ease = t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2;
    cancelAnimationFrame(el._raf);
    const step = now => {
      const k = (now - t0) / dur;
      if (k >= 1) { el.setAttribute('d', orig); return; }
      const m = k < IN ? ease(k / IN) : k > OUT ? 1 - ease((k - OUT) / (1 - OUT)) : 1;
      if (m === 1 && target.vanish) { el.setAttribute('d', 'M0,0Z'); el._raf = requestAnimationFrame(step); return; } // ganz dünn = weg
      el.setAttribute('d', toD(src.map(([x, y], i) => [x + (dst[i][0] - x) * m, y + (dst[i][1] - y) * m])));
      el._raf = requestAnimationFrame(step);
    };
    el._raf = requestAnimationFrame(step);
  }

  const MOODS = {
    erstaunt: {
      '.brow--r': { t: T(0, -30, -4) }, '.brow--l': { t: T(0, -26, 4) },
      '.lid--r': { t: T(0, -16) },
      '.pupil': { t: T(0, 0, 0, 1.06, 1.12) },
      '.dimple': { t: ZERO },
      halo: '.brow',
      '.bridge': { t: N },
    },
    wuetend: {
      '.brow--r': { t: T(4, 16, -16) }, '.brow--l': { t: T(-2, 14, 18) },
      '.lid--r': { t: T(0, 26) },
      '.pupil': { t: T(0, 4, 0, .92, .78) },
      '.dimple': { t: ZERO },
      shake: true,
    },
    nachdenklich: {
      '.brow--r': { t: T(0, -24, -10) }, '.brow--l': { t: T(0, -4, 9) },
      '.lid--r': { t: T(0, -10) },
      '.dimple': { t: ZERO },
      ponder: true, halo: '.brow--r',
    },
    aengstlich: {
      '.brow--r': { t: T(0, -18, 14) }, '.brow--l': { t: T(0, -14, -16) }, '.bridge': { t: N },
      '.lid--r': { t: T(0, -12) },
      '.pupil': { t: T(0, -4, 0, .72) },
      '.dimple': { t: ZERO },
      '.sweat': { t: T(0, 26), from: ZERO, delay: 300 },
      tremble: true,
    },
    weinend: {
      '.brow--r': { t: T(0, -12, 10) }, '.brow--l': { t: T(0, -10, -11) }, '.bridge': { t: N },
      '.lowlid': { t: T(0, 0, 0, .2, 0) },           // Unterlid zieht sich in den Augenbogen zurück
      '.dimple': { t: ZERO },
      tears: true,
    },
  };

  function pose(el, cfg, dur) {
    const rest = cfg.from || (el.classList.contains('fx') ? ZERO : N);
    const t = cfg.t || N, delay = cfg.delay || 0;
    return el.animate([
      { transform: rest, offset: 0 }, { transform: t, offset: IN }, { transform: t, offset: OUT }, { transform: rest, offset: 1 },
    ], { duration: dur - delay, delay, easing: EASE, fill: 'backwards' });
  }

  function express(svg, name) {
    const m = MOODS[name]; if (!m) return;
    svg.getAnimations({ subtree: true }).forEach(a => { if (!a.effect.target.classList.contains('idle')) a.cancel(); }); // Grundbewegung läuft weiter
    svg.dataset.mood = name;
    const dur = HOLD;
    for (const [sel, cfg] of Object.entries(m)) {
      if (typeof cfg !== 'object') continue;
      svg.querySelectorAll(sel).forEach(el => pose(el, cfg, dur));
    }
    svg.querySelectorAll('.mouth').forEach(el => morph(el, MOUTH[name], dur));
    Object.entries(EYES[name] || {}).forEach(([sel, fn]) => svg.querySelectorAll(sel).forEach(el => morph(el, fn, dur)));
    // Wütend: kurzes Beben der Brauen
    if (m.shake) svg.querySelectorAll('.brow, .lid--r').forEach(el =>
      el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-3px)' }, { transform: 'translateX(3px)' }, { transform: 'translateX(0)' }],
        { duration: 120, iterations: 12, delay: 380, composite: 'add' }));
    // Weißer Abstand wächst um die Brauen, solange sie oben sind
    if (m.halo) svg.querySelectorAll(m.halo).forEach(el => el.animate([
      { strokeWidth: 0 }, { strokeWidth: 16, offset: IN }, { strokeWidth: 16, offset: OUT }, { strokeWidth: 0 }],
      { duration: HOLD, easing: EASE }));
    // Nachdenklich: rechte Braue wippt grübelnd hoch und runter, linke zieht sich im Gegentakt zusammen
    if (m.ponder) {
      const o = { duration: 1700, delay: 420, easing: 'ease-in-out', composite: 'add' };
      svg.querySelectorAll('.brow--r').forEach(el => el.animate([
        { transform: T() }, { transform: T(0, -9, -4), offset: .25 }, { transform: T(0, 2, 2), offset: .5 },
        { transform: T(0, -8, -3), offset: .75 }, { transform: T() }], o));
      svg.querySelectorAll('.brow--l').forEach(el => el.animate([
        { transform: T() }, { transform: T(0, 3, 4), offset: .25 }, { transform: T(0, -2, -2), offset: .5 },
        { transform: T(0, 3, 4), offset: .75 }, { transform: T() }], o));
      svg.querySelectorAll('.lid--r').forEach(el => el.animate([
        { transform: T() }, { transform: T(0, -5), offset: .25 }, { transform: T(0, 1), offset: .5 },
        { transform: T(0, -4), offset: .75 }, { transform: T() }], o));
    }
    // Ängstlich: Pupillen zittern
    if (m.tremble) svg.querySelectorAll('.pupil').forEach(el =>
      el.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-2px,1px)' }, { transform: 'translate(2px,-1px)' }, { transform: 'translate(0,0)' }],
        { duration: 90, iterations: 22, delay: 300, composite: 'add' }));
    // Weinend: Tränen wachsen aus dem Auge, kullern runter und schrumpfen weg
    if (m.tears) [['.tear--l', 380], ['.tear--r', 560], ['.tear--l2', 1150], ['.tear--r2', 1330]].forEach(([sel, d]) =>
      svg.querySelectorAll(sel).forEach(el => el.animate([
        { transform: T(0, 0, 0, 0) },
        { transform: T(0, 0, 0, 1), offset: .22 },
        { transform: T(0, 110, 0, .9, 1.1), offset: .82 },
        { transform: T(0, 130, 0, 0) },
      ], { duration: 1100, delay: d, easing: 'cubic-bezier(.5,0,.8,.6)', fill: 'backwards' })));
    setTimeout(() => { if (svg.dataset.mood === name) delete svg.dataset.mood; }, dur + 20);
  }

  const moodBtns = document.querySelectorAll('[data-mood]');
  moodBtns.forEach(btn => btn.addEventListener('click', () => {
    moodBtns.forEach(b => b.setAttribute('aria-pressed', b === btn));
    document.querySelectorAll('[data-blink] svg').forEach(svg => express(svg, btn.dataset.mood));
    clearTimeout(btn._t); btn._t = setTimeout(() => btn.setAttribute('aria-pressed', 'false'), HOLD);
  }));
})();
</script>
</body>
</html>
