  <script><![CDATA[
  (function () {
    // Wurzel-<svg> ermitteln, egal ob die Datei direkt geoeffnet
    // oder in eine andere Seite eingebunden wird.
    var svgEl = document.currentScript.closest('svg');
    if (!svgEl) return;

    // Nur diese drei Ebenen werden gedreht, alles andere (body, guide,
    // title, badge) bleibt wie im Original statisch.
    var layerAussen = svgEl.querySelector('#aussen');
    var layerNadel  = svgEl.querySelector('#nadel');
    var layerInnen  = svgEl.querySelector('#innenteil');

    // Rotationszentrum = Mittelpunkt des Kompass-Badges im viewBox-Koordinatensystem
    var CX = 313.5, CY = 403.7;

    // ─── Maus-Tracking ──────────────────────────────────────
    var mouseX = window.innerWidth  / 2;
    var mouseY = window.innerHeight / 2;

    document.addEventListener('mousemove', function (e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    // ─── Gyroskop-Fallback (Mobile) ─────────────────────────
    var gyroAngle = 0;
    var useGyro   = false;

    function startGyro() {
      window.addEventListener('deviceorientation', function (e) {
        var g = e.gamma || 0;
        var b = e.beta  || 0;
        gyroAngle = Math.atan2(b, g) * (180 / Math.PI);
        useGyro = true;
      }, { passive: true });
    }

    var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    if (isTouch) {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        document.addEventListener('touchstart', function askGyro() {
          DeviceOrientationEvent.requestPermission()
            .then(function (state) { if (state === 'granted') startGyro(); })
            .catch(function () {});
          document.removeEventListener('touchstart', askGyro);
        }, { once: true });
      } else {
        startGyro();
      }
    }

    // ─── Rotation ───────────────────────────────────────────
    var angAussen = 0, angNadel = 0, angInnen = 0;

    // Winkel-Lerp mit kuerzestem Weg (kein 360°-Sprung)
    function lerpAngle(current, target, t) {
      var diff = ((target - current + 540) % 360) - 180;
      return current + diff * t;
    }

    function setRot(el, deg) {
      if (el) el.setAttribute('transform', 'rotate(' + deg.toFixed(3) + ',' + CX + ',' + CY + ')');
    }

    (function compassLoop() {
      var rect = svgEl.getBoundingClientRect();
      var cx = rect.left + rect.width  / 2;
      var cy = rect.top  + rect.height / 2;

      // Winkel: Gyro auf Mobile, Maus auf Desktop
      var raw = useGyro
        ? gyroAngle
        : Math.atan2(mouseY - cy, mouseX - cx) * (180 / Math.PI);

      // Nadel zeigt direkt auf den Cursor (1:1, flott),
      // Aussen dreht sanft mit (0.4x), Innenteil dreht sanft gegen (-0.2x)
      angNadel  = lerpAngle(angNadel,  raw,       0.10);
      angAussen = lerpAngle(angAussen, raw * 0.4, 0.03);
      angInnen  = lerpAngle(angInnen,  raw * -0.2, 0.05);

      setRot(layerNadel,  angNadel);
      setRot(layerAussen, angAussen);
      setRot(layerInnen,  angInnen);

      requestAnimationFrame(compassLoop);
    })();
  })();
  ]]></script>
